<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>HYBE CITY</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen map app. Full-bleed SVG world (camera zooms world → hive → room),
   floating header, side card (bottom sheet on phones), modal room studio. Bright, single light look by choice. */
:root{
  --paper:#E4ECEE;        /* sky-grey ground so the lemon reads */
  --paper-2:#F7F8F3;      /* panels */
  --ink:#17170F;          /* all outlines and text */
  --ink-2:#4B4D44;
  --ink-3:#7B7D72;
  --lemon:#F5FF00;        /* HYBE primary */
  --lemon-soft:#FAFFB8;
  --white:#FFFFFF;
  --veil:rgba(23,23,15,.42);
  --f-display:"Archivo","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#stage.drag{cursor:grabbing}
.room,.island,.empty{cursor:pointer}
.island .plate-top{transition:fill .2s}
.island.hot .plate-top{stroke-width:4}
.room:hover > .hexline{stroke:var(--ink);stroke-width:3.2}
.empty:hover > path{fill-opacity:.85}
.mine > .hexline{stroke:var(--ink);stroke-width:3.4}

/* header */
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:var(--gut-l);right:var(--gut-r);display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:5}
.top > *{pointer-events:auto}
.logo{display:flex;flex-direction:column;justify-content:center;background:var(--lemon);border:2px solid var(--ink);border-radius:14px;padding:6px 14px 7px;box-shadow:3px 3px 0 var(--ink)}
.logo b{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:-.01em;line-height:1}
.logo span{font-family:var(--f-display);font-weight:800;font-size:10.5px;letter-spacing:.08em;margin-top:3px}
.crumbs{display:flex;align-items:center;gap:4px;background:var(--paper-2);border:2px solid var(--ink);border-radius:999px;padding:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{all:unset;cursor:pointer;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;white-space:nowrap}
.crumbs button[aria-current="true"]{background:var(--ink);color:var(--lemon)}
.crumbs button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.crumbs i{font-style:normal;color:var(--ink-3);font-size:12px}
.spacer{flex:1}
.stat{background:var(--paper-2);border:2px solid var(--ink);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;white-space:nowrap}
.stat b{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}

/* buttons */
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:700;font-size:14px;padding:10px 16px;border:2px solid var(--ink);border-radius:12px;background:var(--lemon);color:var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn.ghost{background:var(--white)}
.btn.dark{background:var(--ink);color:var(--lemon)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}

/* labels over the world */
#labels{position:absolute;inset:0;pointer-events:none;z-index:2}
.ilabel{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:0;pointer-events:none}
.ilabel .tag{background:var(--white);border:2px solid var(--ink);border-radius:10px;padding:4px 10px 5px;text-align:center;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.ilabel .tag b{display:block;font-family:var(--f-display);font-weight:900;font-size:15px;line-height:1.05}
.ilabel .tag small{display:block;font-size:10.5px;color:var(--ink-2);font-weight:500}
.ilabel .pole{width:2px;height:16px;background:var(--ink)}
.ilabel.hybe .tag{background:var(--ink);color:var(--lemon)}
.ilabel.hybe .tag small{color:var(--lemon-soft)}
.ilabel.new .tag{background:transparent;border-style:dashed;box-shadow:none}
.rlabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:700;background:var(--white);border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px;white-space:nowrap;pointer-events:none;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.rlabel.mine{background:var(--lemon)}
.rlabel.official{background:var(--ink);color:var(--lemon)}

/* story caption */
#caption{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 86px);z-index:6;display:flex;gap:8px;align-items:center;background:var(--ink);color:var(--white);border-radius:999px;padding:6px 6px 6px 16px;font-weight:700;font-size:14px;box-shadow:3px 3px 0 rgba(23,23,15,.25);max-width:calc(100% - 32px)}
#caption span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#caption em{font-style:normal;color:var(--lemon);font-family:var(--f-display);font-weight:900;margin-right:6px}
#caption button{all:unset;cursor:pointer;background:var(--lemon);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:12.5px;white-space:nowrap}

/* card */
#card{position:absolute;z-index:4;right:var(--gut-r);top:calc(env(safe-area-inset-top,0px) + 92px);width:min(360px, calc(100% - 32px));background:var(--paper-2);border:2px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 130px);overflow:auto}
#card .eyebrow{font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.12em;color:var(--ink-2);text-transform:uppercase}
#card h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;letter-spacing:-.01em;text-wrap:balance}
#card h3{margin:0;font-size:17px;font-weight:700}
#card p{margin:0;font-size:14px;line-height:1.6;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;background:var(--white)}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block;flex:none}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .row{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.meter .row b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.bar{height:12px;border:2px solid var(--ink);border-radius:999px;background:var(--white);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lemon);border-right:2px solid var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.how{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:13.5px;line-height:1.45}
.how .n{font-family:var(--f-display);font-weight:900;background:var(--ink);color:var(--lemon);border-radius:8px;min-width:26px;height:26px;display:grid;place-items:center;font-size:13px}

/* legend + zoom */
#legend{position:absolute;z-index:3;left:var(--gut-l);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--paper-2);border:2px solid var(--ink);border-radius:16px;padding:10px 14px 10px 10px;display:flex;gap:10px;align-items:center;box-shadow:3px 3px 0 var(--ink);max-width:min(420px, calc(100% - 140px))}
#legend svg{width:64px;height:64px;flex:none}
#legend p{margin:0;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
#legend p b{color:var(--ink)}
#legend button{all:unset;cursor:pointer;font-size:12px;font-weight:700;text-decoration:underline;text-underline-offset:3px;margin-top:2px;display:inline-block}
#zoom{position:absolute;z-index:3;right:var(--gut-r);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:8px}
#zoom .btn{width:44px;height:44px;padding:0;font-size:20px;font-family:var(--f-display);font-weight:900}

/* modal */
#modal{position:fixed;inset:0;z-index:20;background:var(--veil);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) var(--gut-r) calc(env(safe-area-inset-bottom,0px) + 16px) var(--gut-l)}
.dialog{background:var(--paper-2);border:2px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);width:min(980px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);position:relative}
.dialog .view{background:var(--paper);border-right:2px solid var(--ink);display:grid;place-items:center;padding:18px;min-height:340px;position:sticky;top:0;align-self:start;min-height:min(560px,78vh);z-index:1}
.dialog .view svg{width:100%;max-width:440px;height:auto;aspect-ratio:1/1.08}
.dialog .side{padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.dialog h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:28px;line-height:1.05;word-break:break-all}
.dialog .sub{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin:0}
.x{all:unset;cursor:pointer;position:absolute;top:12px;right:12px;width:38px;height:38px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:var(--white);font-size:18px;font-weight:900;z-index:2}
.x:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border:1.5px solid var(--ink);border-radius:6px;padding:2px 7px;background:var(--white)}
.badge.mine{background:var(--lemon)}
.badge.official{background:var(--ink);color:var(--lemon)}
.nav{display:flex;gap:8px}
.nav .btn{flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.field > .lab{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-2)}
.field input{font:inherit;font-size:15px;border:2px solid var(--ink);border-radius:10px;padding:9px 12px;background:var(--white);color:var(--ink);min-width:0}
.field input:focus-visible{outline:3px solid var(--lemon);outline-offset:0;box-shadow:0 0 0 5px var(--ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{all:unset;cursor:pointer;width:32px;height:32px;border-radius:9px;border:2px solid var(--ink);box-sizing:border-box}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--paper-2),0 0 0 5px var(--ink)}
.sw:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.fandoms{display:flex;gap:6px;flex-wrap:wrap}
.fandoms button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;background:var(--white)}
.fandoms button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.fandoms button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.slots{display:flex;flex-direction:column;gap:10px}
.slotrow{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;align-items:start}
.slotrow .lab{font-size:12px;font-weight:700;color:var(--ink-2);padding-top:6px}
.opts{display:flex;gap:5px;flex-wrap:wrap}
.opts button{all:unset;cursor:pointer;font-size:12.5px;font-weight:500;border:1.5px solid var(--ink);border-radius:8px;padding:4px 9px;background:var(--white);display:inline-flex;gap:4px;align-items:center}
.opts button[aria-pressed="true"]{background:var(--lemon);font-weight:700}
.opts button.locked{border-style:dashed;color:var(--ink-3);cursor:not-allowed;background:transparent}
.opts button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.qrbox{display:flex;gap:12px;align-items:center;border:2px dashed var(--ink);border-radius:14px;padding:10px 12px;background:var(--lemon-soft)}
.qrbox p{margin:0;font-size:12.5px;line-height:1.5;color:var(--ink-2);flex:1;min-width:0}
.qrbox p b{color:var(--ink)}
.note{font-size:12px;color:var(--ink-3);line-height:1.5;margin:0}

/* scan overlay */
#scan{position:fixed;inset:0;z-index:40;background:rgba(23,23,15,.86);display:grid;place-items:center;padding:20px}
.scanbox{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--white);text-align:center}
.finder{width:180px;height:180px;position:relative;border-radius:18px}
.finder::before,.finder::after{content:"";position:absolute;inset:0;border:4px solid var(--lemon);border-radius:18px;clip-path:polygon(0 0,30% 0,30% 6%,6% 6%,6% 30%,0 30%,0 70%,6% 70%,6% 94%,30% 94%,30% 100%,70% 100%,70% 94%,94% 94%,94% 70%,100% 70%,100% 30%,94% 30%,94% 6%,70% 6%,70% 0,100% 0,100% 100%,0 100%)}
.finder .line{position:absolute;left:8%;right:8%;height:3px;background:var(--lemon);box-shadow:0 0 14px var(--lemon);top:10%;animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{to{top:88%}}
.got{background:var(--paper-2);color:var(--ink);border:2px solid var(--ink);border-radius:18px;padding:18px 20px;max-width:300px;box-shadow:5px 5px 0 var(--lemon)}
.got .pn{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1}
.got .city{font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.12em;color:var(--ink-2);margin-top:4px}
.got p{margin:10px 0 12px;font-size:14px;line-height:1.5}

/* toast */
#toast{position:absolute;z-index:30;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--white);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:3px 3px 0 var(--lemon)}

@media (min-width:761px){
  .dialog{overflow:hidden;max-height:calc(100dvh - 40px)}
  .dialog .side{overflow:auto;max-height:calc(100dvh - 44px)}
  .dialog .view{position:static;min-height:0;align-self:stretch}
}
@media (max-width:760px){
  .logo{padding:6px 11px}
  .logo b{font-size:17px}
  .logo span{display:none}
  .stat,#makeBtn{display:none}
  .top{flex-wrap:nowrap}
  #card{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:var(--gut-l);right:var(--gut-r);width:auto;max-height:44%;padding:14px;gap:10px;border-radius:18px}
  #card h2{font-size:24px}
  #legend{display:none}
  #zoom{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 70px)}
  #zoom .btn{width:38px;height:38px;font-size:17px}
  #caption{top:calc(env(safe-area-inset-top,0px) + 66px);font-size:12.5px}
  .dialog{grid-template-columns:1fr}
  .dialog .view{border-right:0;border-bottom:2px solid var(--ink);min-height:0;padding:10px}
  .dialog .view svg{width:min(210px,60vw)}
  .dialog .view svg{max-width:210px}
  .dialog .side{padding:16px}
  .dialog h2{font-size:23px}
}
@media (prefers-reduced-motion:reduce){
  .finder .line{animation:none;top:48%}
  .btn{transition:none}
}
</style>

<div id="app">
  <svg id="stage" role="application" aria-label="HYBE 세계 지도. 섬을 눌러 팬덤 벌집으로 들어가세요.">
    <defs>
      <pattern id="dots" width="40" height="46.2" patternUnits="userSpaceOnUse">
        <path d="M20 2 L38 12.5 L38 33.5 L20 44 L2 33.5 L2 12.5Z" fill="none" stroke="#17170F" stroke-opacity=".05" stroke-width="1.2"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#dots)"/>
    <g id="cam"><g id="world"></g></g>
  </svg>
  <div id="labels" aria-hidden="true"></div>

  <header class="top">
    <div class="logo"><b>HYBE CITY</b><span>FEEL THE HYBE, FILL THE HIVE</span></div>
    <nav class="crumbs" id="crumbs" aria-label="위치"></nav>
    <div class="spacer"></div>
    <div class="stat" id="stat"></div>
    <button class="btn" id="makeBtn" type="button">내 방 만들기</button>
  </header>

  <div id="caption" hidden></div>
  <aside id="card" aria-live="polite"></aside>

  <div id="legend">
    <svg id="legendSvg" viewBox="-66 -70 132 140" aria-hidden="true"></svg>
    <div>
      <p><b>방 한 칸 = 육각형 한 칸.</b> 아이소메트릭 방을 위에서 보면 육각형이에요. 방이 모이면 팬덤의 벌집, 벌집이 모이면 하이브가 돼요.</p>
      <button type="button" id="replay">처음부터 다시 보기</button>
    </div>
  </div>

  <div id="zoom">
    <button class="btn ghost" type="button" id="zin" aria-label="확대">+</button>
    <button class="btn ghost" type="button" id="zout" aria-label="축소">−</button>
    <button class="btn ghost" type="button" id="zall" aria-label="하이브 전체 보기" style="font-size:12px">ALL</button>
  </div>

  <div id="modal" hidden></div>
  <div id="toast" role="status" hidden></div>
</div>

<script>
(()=>{
/* ---------- geometry: one room = an open isometric cube whose outline is a hexagon ---------- */
const R=60, W=R*Math.sqrt(3)/2, INK='#17170F', LEMON='#F5FF00';
const f1=n=>Math.round(n*10)/10, f3=n=>Math.round(n*1000)/1000;
const pt=(a,b,z)=>[f1((b-a)*W), f1((a+b)*R/2 - z*R)];
const dp=p=>'M'+p.map(q=>q[0]+' '+q[1]).join('L')+'Z';
const P=(p,fill,ex='')=>`<path d="${dp(p)}" fill="${fill}"${ex}/>`;
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=f<0?0:255,p=Math.abs(f);r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function box(a,b,z,da,db,dz,c){return P([pt(a+da,b,z),pt(a+da,b+db,z),pt(a+da,b+db,z+dz),pt(a+da,b,z+dz)],shade(c,-.1))+P([pt(a,b+db,z),pt(a+da,b+db,z),pt(a+da,b+db,z+dz),pt(a,b+db,z+dz)],shade(c,-.22))+P([pt(a,b,z+dz),pt(a+da,b,z+dz),pt(a+da,b+db,z+dz),pt(a,b+db,z+dz)],c);}
const mL=(u,z,du,dz)=>{const o=pt(u+du,0,z+dz);return `matrix(${f3(W*du/100)},${f3(-R/2*du/100)},0,${f3(R*dz/100)},${o[0]},${o[1]})`;};
const mR=(u,z,du,dz)=>{const o=pt(0,u,z+dz);return `matrix(${f3(W*du/100)},${f3(R/2*du/100)},0,${f3(R*dz/100)},${o[0]},${o[1]})`;};
const mF=(a,b,da,db)=>{const o=pt(a,b,0);return `matrix(${f3(W*db/100)},${f3(R/2*db/100)},${f3(-W*da/100)},${f3(R/2*da/100)},${o[0]},${o[1]})`;};
const decal=(m,inner)=>`<g transform="${m}" stroke="none">${inner}</g>`;
const wq=(s,u,z,du,dz)=>s==='L'?[pt(u,0,z),pt(u+du,0,z),pt(u+du,0,z+dz),pt(u,0,z+dz)]:[pt(0,u,z),pt(0,u+du,z),pt(0,u+du,z+dz),pt(0,u,z+dz)];
const wm=(s,u,z,du,dz)=>s==='L'?mL(u,z,du,dz):mR(u,z,du,dz);
const HEXPTS=[[0,-R],[W,-R/2],[W,R/2],[0,R],[-W,R/2],[-W,-R/2]];

function renderRoom(cfg,th,outline=true){

 o+=P([pt(1,0,0),pt(1,0,.05),pt(0,0,.05),pt(0,0,0)],shade(wall,-.2))+P([pt(0,0,0),pt(0,0,.05),pt(0,1,.05),pt(0,1,0)],shade(wall,-.28));

svg.addEventListener('wheel',e=>{e.preventDefault();if(anim){cancelAnimationFrame(anim.raf);anim=null;}zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015));},{passive:false});
function autoLevel(){if(level!=='world'&&camS.s<worldFit().s*1.5){setLevel('world');}}
function tap(t){
 if(story.on){story.skip();return;}
 const g=t.closest&&t.closest('.room,.empty,.island');if(!g)return;
 const isl=t.closest('.island');const id=isl&&isl.dataset.id;
 if(id&&ISL[id].ph){toast('새 그룹이 데뷔하면 이 자리에 새 벌집이 생겨요.');return;}
 if(level==='inside'&&id===current){const r=t.closest('.room,.empty');if(!r)return;const i=+r.dataset.i;if(r.classList.contains('room'))openViewer(current,i);else openBuilder(current);return;}
 if(level==='hive'&&id===current){goInside(id);return;}
 if(id)goHive(id);
}
document.getElementById('zin').onclick=()=>zoomAt(svg.getBoundingClientRect().left+vw/2,svg.getBoundingClientRect().top+vh/2,1.4);
document.getElementById('zout').onclick=()=>zoomAt(svg.getBoundingClientRect().left+vw/2,svg.getBoundingClientRect().top+vh/2,1/1.4);
document.getElementById('zall').onclick=()=>goWorld();
document.getElementById('makeBtn').onclick=()=>openBuilder(current&&current!=='hybe'?current:null);
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!modal.hidden)closeModal();else if(level==='inside')goHive(current);else if(level==='hive')goWorld();}});

/* ---------- toast ---------- */
const toastEl=document.getElementById('toast');let toastT;
function toast(msg){toastEl.textContent=msg;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>toastEl.hidden=true,3200);}

/* ---------- modal: room viewer ---------- */
const modal=document.getElementById('modal');let lastFocus=null;
function openModal(content){lastFocus=document.activeElement;modal.replaceChildren(content);modal.hidden=false;const f=modal.querySelector('.x');f&&f.focus();}
function closeModal(){modal.hidden=true;modal.replaceChildren();lastFocus&&lastFocus.focus&&lastFocus.focus();}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
function roomSvg(cfg,th){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','-64 -68 128 138');s.setAttribute('role','img');s.setAttribute('aria-label','아이소메트릭 방 미리보기');s.innerHTML=`<g stroke="${INK}" stroke-width=".8" stroke-linejoin="round">${renderRoom(cfg,th)}</g>`;return s;}
function openViewer(aid,i){
 const th=A[aid];const {list}=roomsFor(aid);const rm=list[i];if(!rm)return;
 const items=SLOT_ORDER.map(k=>rm.slots[k]).filter(Boolean);
 const badge=rm.official?el('span',{class:'badge official',text:'아티스트 공식 방'}):rm.mine?el('span',{class:'badge mine',text:'내 방'}):rm.example?el('span',{class:'badge',text:'예시 방'}):el('span',{class:'badge',text:'팬의 방'});
 const prev=el('button',{class:'btn ghost',type:'button',text:'← 옆 방',onclick:()=>openViewer(aid,(i-1+list.length)%list.length)});
 const next=el('button',{class:'btn ghost',type:'button',text:'옆 방 →',onclick:()=>openViewer(aid,(i+1)%list.length)});
 const dlg=el('div',{class:'dialog',role:'dialog','aria-modal':'true','aria-label':rm.nick+'의 방'},
  el('button',{class:'x',type:'button','aria-label':'닫기',text:'×',onclick:closeModal}),
  el('div',{class:'view'},roomSvg(rm,th)),
  el('div',{class:'side'},
   el('div',{class:'chips'},badge,el('span',{class:'chip'},el('span',{class:'dot',style:`background:${th.accent}`}),th.short+' · '+th.fandom)),
   el('h2',{text:rm.official?th.short:rm.nick}),
   el('p',{class:'sub',text:rm.official?`${th.hive}의 중심 칸. 팬들이 QR로 모을 수 있는 컨셉 가구가 모두 놓여 있어요.`:`${th.hive}의 ${i+1}번째 칸. ${items.length}개의 가구로 꾸민 방이에요.`}),
   el('div',{class:'field'},el('span',{class:'lab',text:'놓인 가구'}),el('div',{class:'chips'},...items.map(k=>el('span',{class:'chip'+(lockedFor(th).includes(k)?'':''),text:itemName(k,th)+(lockedFor(th).includes(k)?' · QR':'')})))),
   el('div',{class:'nav'},prev,next),
   el('button',{class:'btn',type:'button',text:rm.mine?'내 방 다시 꾸미기':`${th.fandom}으로 내 방 만들기`,onclick:()=>openBuilder(aid)})
  ));
 openModal(dlg);
}

/* ---------- modal: room studio ---------- */
let draft=null;
function myRoom(){const r=remote.find(d=>d.id===myId);return r||localMine;}
function openBuilder(aid){
 const mine=myRoom();
 if(mine)draft=JSON.parse(JSON.stringify(mine));
 else draft={artist:aid||'bts',nick:'',wall:0,floor:0,slots:{wl1:'poster',bed:'bed',desk:'desk',rug:'rug',s1:'plant',s2:'lightstick'}};
 if(aid&&draft.artist!==aid){draft.artist=aid;fixSlots();}
 renderBuilder();
}
function fixSlots(){const th=A[draft.artist];SLOT_ORDER.forEach(k=>{const v=draft.slots[k];if(v&&(!optionsFor(k,th).includes(v)||(lockedFor(th).includes(v)&&!unlocked.has(draft.artist+':'+v))))delete draft.slots[k];});}
function isLocked(th,k){return lockedFor(th).includes(k)&&!unlocked.has(th.id+':'+k);}
let builderView=null;
function renderBuilder(){
 const th=A[draft.artist];
 const view=el('div',{class:'view'});const refresh=()=>{view.replaceChildren(roomSvg(draft,th));};refresh();
 const fand=el('div',{class:'fandoms'},...ARTISTS.map(a=>{const b=el('button',{type:'button','aria-pressed':String(a.id===draft.artist),onclick:()=>{draft.artist=a.id;fixSlots();renderBuilder();}},el('span',{class:'dot',style:`background:${a.accent}`}),a.short);return b;}));
 const nick=el('input',{id:'nick',type:'text',maxlength:'12',placeholder:'예: 보라별',autocomplete:'off'});nick.value=draft.nick||'';nick.addEventListener('input',()=>{draft.nick=nick.value;});
 const swRow=(key,arr,lab)=>el('div',{class:'field'},el('span',{class:'lab',text:lab}),el('div',{class:'swatches'},...arr.map((c,i)=>el('button',{class:'sw',type:'button','aria-label':`${lab} ${i+1}`,'aria-pressed':String((draft[key]|0)===i),style:`background:${c}`,onclick:e=>{draft[key]=i;e.currentTarget.parentNode.querySelectorAll('.sw').forEach((s,j)=>s.setAttribute('aria-pressed',String(j===i)));refresh();}}))));
 const slots=el('div',{class:'slots'},...SLOT_ORDER.map(k=>{
  const opts=[null,...optionsFor(k,th)];
  const row=el('div',{class:'opts'});
  const draw=()=>row.replaceChildren(...opts.map(o=>{const locked=o&&isLocked(th,o);const b=el('button',{type:'button','aria-pressed':String((draft.slots[k]||null)===o),class:locked?'locked':'',title:locked?'QR 조각을 스캔하면 열려요':'',onclick:()=>{if(locked){toast(`‘${itemName(o,th)}’은 QR 조각을 스캔하면 열려요.`);return;}if(o)draft.slots[k]=o;else delete draft.slots[k];draw();refresh();}},o?itemName(o,th):'없음');if(locked)b.prepend(lockIcon());return b;}));
  draw();return el('div',{class:'slotrow'},el('span',{class:'lab',text:SLOTS[k].label}),row);}));
 const remaining=lockedFor(th).filter(k=>isLocked(th,k));
 const qr=el('div',{class:'qrbox'},el('p',{},el('b',{text:`${th.short} 컨셉 가구 ${3-remaining.length}/3 해금`}),el('br'),remaining.length?'빌보드·앨범·위버스에 숨은 QR 조각을 스캔하면 하나씩 열려요.':'모든 컨셉 가구를 모았어요.'),el('button',{class:'btn dark',type:'button',text:'QR 스캔',disabled:remaining.length?null:'',onclick:()=>scanQR()}));
 if(!remaining.length)qr.querySelector('button').disabled=true;
 const save=el('button',{class:'btn',type:'button',text:myRoom()?'내 방 업데이트':'벌집에 내 방 연결하기',onclick:saveRoom});
 const side=el('div',{class:'side'},
  el('div',{class:'eyebrow',style:'font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.12em;color:var(--ink-2)',text:'ROOM STUDIO'}),
  el('h2',{text:'내 방 꾸미기'}),
  el('p',{class:'sub',text:'팬덤을 고르면 그 아티스트의 컨셉 가구로 방을 꾸밀 수 있어요. 완성한 방은 팬덤 벌집의 빈 칸에 연결돼요.'}),
  el('div',{class:'field'},el('span',{class:'lab',text:'팬덤'}),fand),
  el('div',{class:'field'},el('label',{for:'nick',text:'닉네임 (12자)'}),nick),
  swRow('wall',th.walls,'벽지'),swRow('floor',th.floors,'바닥'),
  el('div',{class:'field'},el('span',{class:'lab',text:'가구'}),slots),
  qr,save,
  el('p',{class:'note',text:db?(canShare===false?'이 링크에서는 저장 권한이 없어 이 브라우저에만 보여요.':'저장하면 이 페이지를 여는 모든 사람에게 내 방이 보여요.'):'로그인한 상태로 열면 다른 팬들에게도 내 방이 보여요. 지금은 이 브라우저에만 저장돼요.'})
 );
 const dlg=el('div',{class:'dialog',role:'dialog','aria-modal':'true','aria-label':'내 방 꾸미기'},el('button',{class:'x',type:'button','aria-label':'닫기',text:'×',onclick:closeModal}),view,side);
 builderView=dlg;
 if(modal.hidden)openModal(dlg);else{modal.replaceChildren(dlg);}
}
function lockIcon(){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 12 14');s.setAttribute('width','10');s.setAttribute('height','12');s.setAttribute('aria-hidden','true');s.innerHTML='<rect x="1" y="6" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 6V4a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/>';return s;}
function scanQR(){
 const th=A[draft.artist];const rem=lockedFor(th).filter(k=>isLocked(th,k));if(!rem.length)return;
 const k=rem[0];const ov=el('div',{id:'scan'},el('div',{class:'scanbox'},el('div',{class:'finder'},el('div',{class:'line'})),el('p',{style:'margin:0;font-weight:700',text:'빌보드의 QR 조각을 비추는 중…'})));
 builderView.appendChild(ov);
 setTimeout(()=>{
  unlocked.add(th.id+':'+k);try{localStorage.setItem('hc-unlocked',JSON.stringify([...unlocked]));}catch(e){}
  const n=String(Math.floor(Math.random()*2026)+1).padStart(4,'0');const city=CITIES[Math.floor(Math.random()*CITIES.length)];
  const kind=ITEMS[k].kind;const slot=SLOT_ORDER.find(s=>SLOTS[s].kind===kind&&!draft.slots[s])||SLOT_ORDER.find(s=>SLOTS[s].kind===kind);
  ov.replaceChildren(el('div',{class:'got'},el('div',{class:'pn',text:'PIECE #'+n}),el('div',{class:'city',text:'FOUND IN '+city}),el('p',{},'‘',el('b',{text:itemName(k,th)}),'’ 가구가 열렸어요.'),
   el('div',{class:'actions'},el('button',{class:'btn',type:'button',text:'방에 놓기',onclick:()=>{draft.slots[slot]=k;renderBuilder();}}),el('button',{class:'btn ghost',type:'button',text:'나중에',onclick:()=>renderBuilder()}))));
  ov.querySelector('.btn').focus();
 },reduce?200:1300);
}
async function saveRoom(){
 const th=A[draft.artist];draft.nick=(draft.nick||'').trim().slice(0,12);
 if(!draft.nick){toast('닉네임을 입력해 주세요.');const n=document.getElementById('nick');n&&n.focus();return;}
 fixSlots();
 const doc={artist:draft.artist,nick:draft.nick,wall:draft.wall|0,floor:draft.floor|0,slots:{...draft.slots},at:(myRoom()&&myRoom().at)||Date.now()};
 let shared=false;
 if(db&&myId&&canShare!==false){try{await db.collection('rooms').doc(myId).set(doc);shared=true;}catch(e){canShare=false;}}
 localMine=clean(doc);try{localStorage.setItem('hc-myroom',JSON.stringify(localMine));}catch(e){}
 if(shared){const i=remote.findIndex(d=>d.id===myId);const r={...localMine,id:myId};if(i>=0)remote[i]=r;else remote.push(r);}
 closeModal();renderWorld();
 setLevel('inside',draft.artist);await animateTo(insideFit(draft.artist),900);
 const {list,total}=roomsFor(draft.artist);const idx=list.findIndex(r=>r.mine);
 if(idx>=0){const [x,y]=cellXY(spiral(total)[idx]);const i=ISL[draft.artist];await animateTo({x:i.x+x,y:i.y+y,s:Math.min(vw,vh-200)/260},700);setTimeout(()=>animateTo(insideFit(draft.artist),900),900);}
 toast(shared?`${th.short} 벌집에 내 방이 연결됐어요.`:`${th.short} 벌집에 내 방이 연결됐어요. (이 브라우저에만 저장)`);
}

/* ---------- legend ---------- */
document.getElementById('legendSvg').innerHTML=`<g stroke="${INK}" stroke-width="1" stroke-linejoin="round">${renderRoom(officialRoom(A.bts),A.bts,false)}</g><path d="${hexD(1.02)}" fill="none" stroke="${INK}" stroke-width="3" stroke-dasharray="6 5"/>`;

/* ---------- story: room → hive → HYBE ---------- */
const capEl=document.getElementById('caption');
const story={on:false,cancel:false,
 async play(){
  if(reduce){goWorld();return;}
  this.on=true;this.cancel=false;modal.hidden||closeModal();
  const isl=ISL.bts;const [x,y]=cellXY(spiral(19)[3]);
  setLevel('world');card.hidden=true;Object.assign(camS,{x:isl.x+x,y:isl.y+y+8,s:Math.min(vw,vh-120)/150});applyCam();
  const steps=[['01','나의 방 — 아이소메트릭 방 한 칸'],['02','팬덤의 벌집 — 방이 모이면 육각형 벌집'],['03','하이브 — 벌집이 모이면 하나의 세계']];
  const show=i=>{capEl.hidden=false;capEl.replaceChildren(el('span',{},el('em',{text:steps[i][0]}),steps[i][1]),el('button',{type:'button',text:'건너뛰기',onclick:()=>this.skip()}));};
  show(0);await wait(1300);if(this.cancel)return;
  show(1);await animateTo({...hiveFit('bts')},1700);if(this.cancel)return;await wait(900);if(this.cancel)return;
  show(2);await animateTo(worldFit(),1800);if(this.cancel)return;await wait(1100);
  this.end();
 },
 skip(){this.cancel=true;if(anim){cancelAnimationFrame(anim.raf);anim=null;}this.end();Object.assign(camS,worldFit());applyCam();},
 end(){this.on=false;capEl.hidden=true;setLevel('world');}
};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
document.getElementById('replay').onclick=()=>story.play();

/* ---------- shared rooms (db) ---------- */
async function connect(){
 try{
  const c=window.claude;if(!c||!c.use)return;
  const [d,u]=await Promise.all([c.use('db'),c.use('user')]);
  if(u){try{myId=await u.id();}catch(e){}try{canShare=await u.can('data.write');}catch(e){}}
  if(!d)return;db=d;
  db.collection('rooms').onSnapshot(snap=>{
   remote=snap.docs.filter(x=>x.exists&&valid(x.data())).map(x=>({...clean(x.data()),id:x.id}));
   if(myId&&remote.some(r=>r.id===myId))localMine=null;
   if(modal.hidden){renderWorld();if(level!=='world')renderCard();buildLabels();}else updateStat();
  },()=>{});
 }catch(e){}
}

/* ---------- boot ---------- */
size();renderWorld();renderCrumbs();
Object.assign(camS,worldFit());applyCam();renderCard();
addEventListener('resize',()=>{size();if(level==='world')Object.assign(camS,worldFit());else if(level==='hive')Object.assign(camS,hiveFit(current));else Object.assign(camS,insideFit(current));applyCam();});
connect();
if(location.hash!=='#world')setTimeout(()=>story.play(),350);
})();
</script>
